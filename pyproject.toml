[project]
name = "gigaloom"
version = "0.9.1"
description = "GigaLoom local, provider-neutral control plane for coding agents"
authors = [{ name = "Ruslan Yakupov", email = "rusyak1999@gmail.com" }]
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "MIT"
dependencies = [
    "agent-client-protocol==0.11.1",
    "anyio>=4.10,<5",
    "cryptography>=46,<51",
    "fastapi>=0.133.0,<1",
    "pydantic>=2.12.0,<3",
    "pyjwt[crypto]>=2.12.0,<3",
    "pyyaml>=6.0,<7",
    "python-dateutil>=2.9.0,<3",
    "starlette>=1.1,<2",
    "uvicorn>=0.41.0,<1",
]

[project.urls]
Homepage = "https://krakenalt.github.io/gigaloom/"
Repository = "https://github.com/krakenalt/gigaloom"
Documentation = "https://krakenalt.github.io/gigaloom/"
Issues = "https://github.com/krakenalt/gigaloom/issues"
Changelog = "https://github.com/krakenalt/gigaloom/blob/main/CHANGELOG_en.md"

[project.scripts]
giga = "gigaloom.entrypoint:main"

[project.entry-points."gigaloom.harnesses.v1"]
direct-chat = "gigaloom.harnesses.direct_chat:DirectChatHarness"
codex-cli = "gigaloom.harnesses.codex_cli:CodexCliHarness"
claude-code = "gigaloom.harnesses.claude_code:ClaudeCodeHarness"
gemini-cli = "gigaloom.harnesses.gemini_cli:GeminiCliHarness"
echo = "gigaloom.harnesses.echo:EchoHarness"

[project.entry-points."gigaloom.harness_adapters.v1"]
direct-chat = "gigaloom.harnesses.direct_chat:DirectChatHarness"
codex-cli = "gigaloom.harnesses.codex_cli:CodexCliHarness"
claude-code = "gigaloom.harnesses.claude_code:ClaudeCodeHarness"
gemini-cli = "gigaloom.harnesses.gemini_cli:GeminiCliHarness"
echo = "gigaloom.harnesses.echo:EchoHarness"

[project.entry-points."gigaloom.provider_adapters.v1"]
direct-chat-legacy = "gigaloom.provider_profiles:direct_chat_legacy_compatibility"
codex-legacy = "gigaloom.provider_profiles:codex_legacy_compatibility"
claude-legacy = "gigaloom.provider_profiles:claude_legacy_compatibility"
gemini-legacy = "gigaloom.provider_profiles:gemini_legacy_compatibility"

[project.entry-points."gigaloom.environment_providers.v1"]
git = "gigaloom.environments:git_environment_provider_plugin"

[project.optional-dependencies]
gpt2giga = [
    "gpt2giga>=0.3.0,<0.4.0",
]
claude-sdk = [
    "claude-agent-sdk>=0.2.122,<0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "src/gigaloom/evidence/**",
    "src/gigaloom/integration_sdk_preview/**",
    "src/gigaloom/ui/web/assets/**",
]

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gigaloom"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "scripts/asset_contract.py",
    "scripts/hatch_build.py",
    "CHANGELOG.md",
    "CHANGELOG_en.md",
]

[tool.coverage.run]
omit = [
  "tests/*",
  "scripts/*",
  "docs/*",
  "*/migrations/*",
  "examples/*",
  "*/__pycache__/*",
  ".local/"
]
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = [
    "src/gigaloom/application",
    "src/gigaloom/attachments",
    "src/gigaloom/contracts",
    "src/gigaloom/core",
    "src/gigaloom/evidence",
    "src/gigaloom/execution",
    "src/gigaloom/native",
    "src/gigaloom/protocols",
    "src/gigaloom/projects/backup_contracts.py",
    "src/gigaloom/projects/backup.py",
    "src/gigaloom/projects/backup_io.py",
    "src/gigaloom/projects/state_migration.py",
    "src/gigaloom/projects/state_migration_io.py",
    "src/gigaloom/review",
]

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "httpx2 (>=2.9.1,<3)",
    "pytest (>=9.0.3, <10.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
    "ruff (>=0.15,<0.16)",
    "ty==0.0.18",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
]
integrations = [
    "openai-agents (>=0.17,<1)",
    "pyjwt (>=2.12.0)",
    "python-multipart (>=0.0.27, <0.1.0)"
]
