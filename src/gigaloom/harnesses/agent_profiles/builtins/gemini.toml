schema_version = 1
agent_id = "gemini"
display_name = "Gemini CLI"
aliases = []
profile_version = "1.0.0"
auth_owner = "provider"
platform_support = ["darwin", "linux", "win32"]

[source]
kind = "builtin"
origin = "gigaloom:builtin/gemini.toml"
revision = "0.7.0-alpha.1-p0-02"
trust_class = "first_party"
reviewed = true

[native]
executable_names = ["gemini"]
provider_home_markers = ["GEMINI_CLI_HOME"]
provider_config_markers = ["settings.json"]
version_probe = ["--version"]
supports_managed_terminal = true

[[native.interactive_matchers]]
matcher_id = "gemini.root"
kind = "empty_suffix"
tokens = []
precedence = 10

[[native.interactive_matchers]]
matcher_id = "gemini.prompt"
kind = "single_positional"
tokens = []
precedence = 20

[[native.interactive_matchers]]
matcher_id = "gemini.interactive"
kind = "first_token_with_value"
tokens = ["-i", "--prompt-interactive"]
precedence = 30

[[native.interactive_matchers]]
matcher_id = "gemini.resume"
kind = "first_token_with_value"
tokens = ["-r", "--resume"]
precedence = 40

[[native.metadata_matchers]]
matcher_id = "gemini.metadata.options"
kind = "any_option"
tokens = ["--help", "-h", "--version"]
precedence = 10

[[native.metadata_matchers]]
matcher_id = "gemini.metadata.commands"
kind = "first_token"
tokens = ["help", "version", "completion"]
precedence = 20

[[native.headless_matchers]]
matcher_id = "gemini.headless.options"
kind = "any_option"
tokens = ["--prompt", "-p", "--list-sessions", "--delete-session", "--experimental-acp", "--acp", "--output-format"]
precedence = 10

[[native.headless_matchers]]
matcher_id = "gemini.protocol.commands"
kind = "first_token"
tokens = ["acp"]
precedence = 20

[[native.headless_matchers]]
matcher_id = "gemini.admin.commands"
kind = "first_token"
tokens = ["extensions", "mcp", "skills", "update"]
precedence = 30

[[compatibility_profiles]]
compatibility_profile_id = "gemini.acp.v1"
revision = "0.46.x"
evidence_digest = "c0088f2282929e7cde079c32c083ffc6fb022a0880fadea6d57deb01953d54cb"

[[structured_routes]]
route_id = "gemini.acp"
harness_id = "gemini-cli"
transport_kind = "acp_stdio_v1"
compatibility_profile_id = "gemini.acp.v1"
command_ref = { executable_name = "gemini", arguments = ["--experimental-acp"] }
capability_requirements = ["structured_prompt"]
version_policy = { kind = "reviewed_range", minimum = "0.46.0", maximum_exclusive = "0.47.0" }
