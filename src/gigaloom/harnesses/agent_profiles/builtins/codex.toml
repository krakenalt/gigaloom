schema_version = 1
agent_id = "codex"
display_name = "Codex"
aliases = []
profile_version = "1.0.0"
auth_owner = "provider"
platform_support = ["darwin", "linux", "win32"]

[source]
kind = "builtin"
origin = "gigaloom:builtin/codex.toml"
revision = "builtin-agent-profile.v1"
trust_class = "first_party"
reviewed = true

[native]
executable_names = ["codex"]
provider_home_markers = ["CODEX_HOME"]
provider_config_markers = ["config.toml"]
version_probe = ["--version"]
supports_managed_terminal = true

[[native.interactive_matchers]]
matcher_id = "codex.root"
kind = "empty_suffix"
tokens = []
precedence = 10

[[native.interactive_matchers]]
matcher_id = "codex.prompt"
kind = "single_positional"
tokens = []
precedence = 20

[[native.interactive_matchers]]
matcher_id = "codex.resume"
kind = "first_token_with_value"
tokens = ["resume"]
precedence = 30

[[native.interactive_matchers]]
matcher_id = "codex.fork"
kind = "first_token_with_value"
tokens = ["fork"]
precedence = 40

[[native.metadata_matchers]]
matcher_id = "codex.metadata.options"
kind = "any_option"
tokens = ["--help", "-h", "--version"]
precedence = 10

[[native.metadata_matchers]]
matcher_id = "codex.metadata.commands"
kind = "first_token"
tokens = ["help", "version", "completion"]
precedence = 20

[[native.headless_matchers]]
matcher_id = "codex.headless.commands"
kind = "first_token"
tokens = ["exec", "e", "review", "sandbox", "app-server", "mcp-server"]
precedence = 10

[[native.headless_matchers]]
matcher_id = "codex.admin.commands"
kind = "first_token"
tokens = ["apply", "archive", "cloud", "debug", "delete", "doctor", "execpolicy", "features", "login", "logout", "mcp", "plugin", "remote-control", "unarchive", "update"]
precedence = 20

[[compatibility_profiles]]
compatibility_profile_id = "codex.app-server.v1"
revision = "0.144.x"
evidence_digest = "c0088f2282929e7cde079c32c083ffc6fb022a0880fadea6d57deb01953d54cb"

[[structured_routes]]
route_id = "codex.app-server"
harness_id = "codex-cli"
transport_kind = "codex_app_server_v1"
compatibility_profile_id = "codex.app-server.v1"
command_ref = { executable_name = "codex", arguments = ["app-server"] }
capability_requirements = ["structured_prompt"]
version_policy = { kind = "reviewed_range", minimum = "0.144.0", maximum_exclusive = "0.145.0" }
