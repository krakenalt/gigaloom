name: GigaLoom quality

on:
  push:
    branches: [main]
    paths:
      - "src/gigaloom/**"
      - "web/**"
      - "architecture/**"
      - "tests/**"
      - "benchmarks/gigaloom_performance/**"
      - "scripts/ci-*.sh"
      - "scripts/check_legacy_identifiers.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gigaloom-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  GIGALOOM_UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv

jobs:
  frontend:
    name: Frontend / static and browser
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock

      - name: Reject stale Python dependency locks first
        run: uv lock --check

      - name: Set up Node.js 22.13
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned npm 11.17
        run: npm install --global --ignore-scripts npm@11.17.0

      - name: Install pinned frontend dependencies
        run: npm --prefix web ci --ignore-scripts

      - name: Run typecheck, lint, unit, and determinism gates
        run: npm --prefix web run check

      - name: Produce clean commit-bound assets
        run: npm --prefix web run build:release

      - name: Install standalone browser-QA runtime
        env:
          GIGALOOM_PYTHON: "3.13"
        run: ./scripts/ci-base.sh sync

      - name: Install Chromium
        run: npm --prefix web exec -- playwright install --with-deps chromium

      - name: Run desktop and 390x844 browser QA
        id: browser_qa
        env:
          CI: "true"
        run: npm --prefix web run test:e2e

      - name: Verify asset provenance, SBOM, and licenses
        run: .venv/bin/python scripts/asset_contract.py --require-clean

      - name: Upload commit-bound assets
        uses: actions/upload-artifact@v7
        with:
          name: gigaloom-assets-${{ github.sha }}
          path: src/gigaloom/ui/web/assets
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser evidence
        if: ${{ !cancelled() && steps.browser_qa.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: gigaloom-browser-qa-${{ github.sha }}
          path: test-results/browser-qa
          if-no-files-found: error
          retention-days: 7

  python:
    name: Python / ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: frontend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download verified frontend assets
        uses: actions/download-artifact@v8
        with:
          name: gigaloom-assets-${{ github.sha }}
          path: src/gigaloom/ui/web/assets

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock

      - name: Install standalone test environment
        env:
          GIGALOOM_PYTHON: ${{ matrix.python-version }}
        run: ./scripts/ci-base.sh sync

      - name: Run Ruff
        if: matrix.python-version == '3.13'
        run: |
          ./scripts/ci-base.sh ruff-check .
          ./scripts/ci-base.sh ruff-format-check .

      - name: Run ty
        if: matrix.python-version == '3.13'
        run: ./scripts/ci-base.sh type-check

      - name: Run Harness tests
        run: >-
          ./scripts/ci-base.sh pytest tests/harness -n 4
          --cov=. --cov-report=json:coverage.json --cov-fail-under=80

      - name: Upload coverage evidence
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: gigaloom-coverage-3.13
          path: coverage.json
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package / base artifact
    runs-on: ubuntu-latest
    needs: frontend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download verified frontend assets
        uses: actions/download-artifact@v8
        with:
          name: gigaloom-assets-${{ github.sha }}
          path: src/gigaloom/ui/web/assets

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock

      - name: Set up Node.js 22.13
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned npm 11.17
        run: npm install --global --ignore-scripts npm@11.17.0

      - name: Install artifact-test environment
        env:
          GIGALOOM_PYTHON: "3.13"
        run: ./scripts/ci-base.sh sync

      - name: Build standalone wheel and sdist
        run: uv build --wheel --sdist --no-sources --out-dir dist/gigaloom

      - name: Pack the Web npm artifact
        run: |
          mkdir -p dist/web
          npm pack ./web --ignore-scripts --pack-destination dist/web

      - name: Verify the legacy identifier denylist
        run: >-
          .venv/bin/python scripts/check_legacy_identifiers.py
          --source-root .
          --wheel dist/gigaloom/gigaloom-*.whl
          --sdist dist/gigaloom/gigaloom-*.tar.gz
          --npm-tarball dist/web/gigaloom-web-*.tgz

      - name: Verify base isolation and installed artifact evidence
        run: >-
          ./scripts/ci-base.sh pytest
          tests/test_gigaloom_artifact_isolation.py
          tests/test_gigaloom_governance_contract.py
          tests/test_gigaloom_quality_workflows.py
          tests/harness/test_ui_packaging.py
          -q -n 0

      - name: Upload standalone distribution
        uses: actions/upload-artifact@v7
        with:
          name: gigaloom-${{ github.sha }}
          path: dist/gigaloom/*
          if-no-files-found: error
          retention-days: 7

  terminal:
    name: Terminal / ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: frontend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13", "3.14"]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download verified frontend assets
        uses: actions/download-artifact@v8
        with:
          name: gigaloom-assets-${{ github.sha }}
          path: src/gigaloom/ui/web/assets

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Build and install standard wheel
        run: |
          uv build --wheel --no-sources --out-dir dist/terminal
          uv venv --python ${{ matrix.python-version }} .venv-terminal
          uv pip install --python .venv-terminal dist/terminal/gigaloom-*.whl

      - name: Smoke native launcher and CLI
        run: |
          uv run --python .venv-terminal --no-project python -I -c "import importlib.metadata as m, importlib.util as u; assert all(not r.casefold().startswith('textual') for r in m.requires('gigaloom')); assert u.find_spec('gigaloom.tui') is None"
          uv run --python .venv-terminal --no-project giga
          uv run --python .venv-terminal --no-project giga --help
          uv run --python .venv-terminal --no-project giga --version
          uv run --python .venv-terminal --no-project giga --non-interactive --help

      - name: Smoke reinstall, rollback, and uninstall mechanics
        run: |
          uv pip install --python .venv-terminal --reinstall dist/terminal/gigaloom-*.whl
          uv pip uninstall --python .venv-terminal gigaloom
          uv pip install --python .venv-terminal dist/terminal/gigaloom-*.whl
          uv run --python .venv-terminal --no-project giga --version
          uv pip uninstall --python .venv-terminal gigaloom
          uv run --python .venv-terminal --no-project python -I -c "import importlib.util; assert importlib.util.find_spec('gigaloom') is None"

  performance:
    name: Performance / ci-smoke
    runs-on: ubuntu-latest
    needs: frontend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download verified frontend assets
        uses: actions/download-artifact@v8
        with:
          name: gigaloom-assets-${{ github.sha }}
          path: src/gigaloom/ui/web/assets

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock

      - name: Install standalone performance environment
        env:
          GIGALOOM_PYTHON: "3.13"
        run: ./scripts/ci-base.sh sync

      - name: Run deterministic performance budgets
        run: .venv/bin/giga benchmark performance --profile ci-smoke --samples 5 --output performance-artifacts/ci-smoke.json

      - name: Upload bounded performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gigaloom-performance-ci-smoke
          path: performance-artifacts/ci-smoke.json
          if-no-files-found: error
          retention-days: 7

  registry-readiness:
    name: Public registry / exact gateway lock
    runs-on: ubuntu-latest
    needs: frontend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download verified frontend assets
        uses: actions/download-artifact@v8
        with:
          name: gigaloom-assets-${{ github.sha }}
          path: src/gigaloom/ui/web/assets

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync every locked optional integration
        env:
          GIGALOOM_PYTHON: "3.13"
        run: ./scripts/ci-base.sh sync-all-extras

      - name: Verify exact public gateway resolution and runtime
        run: ./scripts/ci-public-gateway.sh
