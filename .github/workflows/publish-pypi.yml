name: GigaLoom release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gigaloom-release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Release candidate / build immutable bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js 22.13
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned npm 11.17
        run: npm install --global --ignore-scripts npm@11.17.0

      - name: Fetch target main for ancestry proof
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Verify candidate repository, identity, commit, and ancestry
        id: guard
        run: >-
          python3 scripts/release_guard.py
          --policy .github/release-policy.json
          --release-manifest release/release.json
          --python-metadata pyproject.toml
          --npm-metadata web/package.json
          --event-name "${GITHUB_EVENT_NAME}"
          --repository "${GITHUB_REPOSITORY}"
          --ref "${GITHUB_REF}"
          --commit "${GITHUB_SHA}"
          --main-ref origin/main
          --github-output "${GITHUB_OUTPUT}"

      - name: Install standalone build dependencies
        run: |
          npm --prefix web ci --ignore-scripts
          ./scripts/ci-base.sh sync-all-extras

      - name: Run release-facing non-live checks
        run: |
          npm --prefix web run check
          ./scripts/ci-public-gateway.sh
          python3 scripts/check_legacy_identifiers.py --source-root .

      - name: Build canonical Web assets once
        env:
          GIGALOOM_SOURCE_REVISION: ${{ github.sha }}
        run: |
          npm --prefix web run build:npm:release
          npm --prefix web run pack:verify
          python3 scripts/asset_contract.py --require-clean

      - name: Build Python and npm candidate artifacts
        run: |
          mkdir -p dist/release-candidate
          uv build --wheel --sdist --no-sources --out-dir dist/release-candidate
          npm pack ./web --ignore-scripts --pack-destination dist/release-candidate
          cp release/release.json dist/release-candidate/release.json
          cp src/gigaloom/ui/web/assets/_build/licenses.json dist/release-candidate/licenses.json
          cp src/gigaloom/ui/web/assets/_build/provenance.json dist/release-candidate/web-provenance.json
          cp src/gigaloom/ui/web/assets/_build/sbom.cdx.json dist/release-candidate/sbom.cdx.json
          cp release/0.7-external-evidence.json dist/release-candidate/external-evidence.json
          cp release/0.7-native-agent-gateway-candidate-report.md dist/release-candidate/native-agent-gateway-report.md
          cp tests/fixtures/run_capsules/read_only_run.json dist/release-candidate/run-capsule-fixture.json

      - name: Verify immutable multi-registry candidate
        run: |
          python3 scripts/verify_release_artifacts.py \
            --release release/release.json \
            --artifact-dir dist/release-candidate \
            --source-revision "${GITHUB_SHA}" \
            --output dist/release-candidate/candidate-manifest.json \
            --checksums dist/release-candidate/SHA256SUMS
          python3 scripts/check_legacy_identifiers.py \
            --wheel dist/release-candidate/*.whl \
            --sdist dist/release-candidate/*.tar.gz \
            --npm-tarball dist/release-candidate/*.tgz
          (cd dist/release-candidate && sha256sum --check SHA256SUMS)

      - name: Upload immutable candidate bundle
        uses: actions/upload-artifact@v7
        with:
          name: gigaloom-release-candidate-${{ github.sha }}
          path: dist/release-candidate/*
          if-no-files-found: error
          retention-days: 90

  attest:
    name: Release candidate / attest immutable bundle
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download immutable candidate bundle
        uses: actions/download-artifact@v8
        with:
          name: gigaloom-release-candidate-${{ github.sha }}
          path: dist/release-candidate

      - name: Verify retained candidate checksums
        run: |
          cd dist/release-candidate
          sha256sum --check SHA256SUMS

      - name: Attest candidate bundle
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/release-candidate/*
