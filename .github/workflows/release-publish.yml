name: GigaLoom protected release publication

on:
  workflow_run:
    workflows:
      - GigaLoom release candidate
    types:
      - completed
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Candidate workflow run ID containing the retained bundle
        required: true
        type: string
      candidate_sha:
        description: Full main commit SHA used to build the retained bundle
        required: true
        type: string
      candidate_manifest_sha256:
        description: SHA-256 of candidate-manifest.json from the attested bundle
        required: true
        type: string
      git_tag:
        description: Existing protected v<release> tag at candidate_sha
        required: true
        type: string
      recovery_mode:
        description: Only the registry operation still permitted
        required: true
        default: initial
        type: choice
        options:
          - initial
          - recover-pypi
          - recover-npm
          - release-assets-only

permissions:
  contents: read

concurrency:
  group: gigaloom-protected-release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.git_tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Release publish / resolve retained candidate
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_manifest_sha256: ${{ steps.candidate.outputs.candidate_manifest_sha256 }}
      candidate_run_id: ${{ steps.candidate.outputs.candidate_run_id }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      git_tag: ${{ steps.candidate.outputs.git_tag }}
      recovery_mode: ${{ steps.candidate.outputs.recovery_mode }}

    steps:
      - name: Checkout completed candidate source
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve manual recovery or completed candidate
        id: candidate
        uses: actions/github-script@v8
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          INPUT_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INPUT_GIT_TAG: ${{ inputs.git_tag }}
          INPUT_RECOVERY_MODE: ${{ inputs.recovery_mode }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');
            const eventName = process.env.EVENT_NAME;
            const shaPattern = /^(?:[0-9a-f]{40}|[0-9a-f]{64})$/;
            const digestPattern = /^[0-9a-f]{64}$/;
            const runPattern = /^[1-9][0-9]*$/;
            const tagPattern = /^v[0-9]+\.[0-9]+\.[0-9]+(?:-(?:alpha|beta|rc)\.[1-9][0-9]*)?$/;
            const recoveryModes = new Set([
              'initial',
              'recover-pypi',
              'recover-npm',
              'release-assets-only',
            ]);
            const { owner, repo } = context.repo;

            if (eventName === 'workflow_dispatch') {
              const values = {
                candidate_manifest_sha256: process.env.INPUT_CANDIDATE_MANIFEST_SHA256,
                candidate_run_id: process.env.INPUT_CANDIDATE_RUN_ID,
                candidate_sha: process.env.INPUT_CANDIDATE_SHA,
                git_tag: process.env.INPUT_GIT_TAG,
                recovery_mode: process.env.INPUT_RECOVERY_MODE,
              };
              if (!digestPattern.test(values.candidate_manifest_sha256)) {
                core.setFailed('candidate manifest digest must be a lowercase SHA-256');
                return;
              }
              if (!runPattern.test(values.candidate_run_id)) {
                core.setFailed('candidate run ID must be a positive integer');
                return;
              }
              if (!shaPattern.test(values.candidate_sha)) {
                core.setFailed('candidate SHA must be a full lowercase Git SHA');
                return;
              }
              if (!tagPattern.test(values.git_tag)) {
                core.setFailed('release tag does not match the supported v<release> form');
                return;
              }
              if (!recoveryModes.has(values.recovery_mode)) {
                core.setFailed('unsupported recovery mode');
                return;
              }
              for (const [name, value] of Object.entries(values)) {
                core.setOutput(name, value);
              }
              return;
            }

            if (eventName !== 'workflow_run') {
              core.setFailed(`unsupported release trigger: ${eventName}`);
              return;
            }
            const run = context.payload.workflow_run;
            const runRepository = run?.head_repository?.full_name ?? run?.repository?.full_name;
            if (
              run?.status !== 'completed' ||
              run?.conclusion !== 'success' ||
              run?.event !== 'push' ||
              runRepository !== `${owner}/${repo}`
            ) {
              core.setFailed('triggering candidate run is not a successful repository tag push');
              return;
            }
            const candidateSha = run.head_sha;
            const candidateRunId = String(run.id);
            let release;
            try {
              release = JSON.parse(fs.readFileSync('release/release.json', 'utf8'));
            } catch (error) {
              core.setFailed(`release manifest is unavailable: ${error.message}`);
              return;
            }
            const gitTag = release.git_tag;
            if (!shaPattern.test(candidateSha) || !tagPattern.test(gitTag)) {
              core.setFailed('completed candidate SHA or manifest tag is malformed');
              return;
            }
            let tagCommit;
            try {
              tagCommit = execFileSync(
                'git',
                ['rev-parse', `refs/tags/${gitTag}^{commit}`],
                { encoding: 'utf8' },
              ).trim();
            } catch (error) {
              core.setFailed(`manifest release tag is unavailable: ${error.message}`);
              return;
            }
            if (tagCommit !== candidateSha) {
              core.setFailed('manifest release tag does not resolve to the candidate SHA');
              return;
            }
            const expectedArtifact = `gigaloom-release-candidate-${candidateSha}`;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: run.id, per_page: 100 },
            );
            const retained = artifacts.filter(
              artifact => artifact.name === expectedArtifact && !artifact.expired,
            );
            if (retained.length !== 1) {
              core.setFailed('triggering candidate run must retain exactly one SHA-bound artifact');
              return;
            }

            core.setOutput('candidate_manifest_sha256', '');
            core.setOutput('candidate_run_id', candidateRunId);
            core.setOutput('candidate_sha', candidateSha);
            core.setOutput('git_tag', gitTag);
            core.setOutput('recovery_mode', 'initial');
            core.info(`selected triggering candidate run ${candidateRunId} for ${gitTag} at ${candidateSha}`);

  publish:
    name: Release publish / protected registries
    needs: resolve
    environment: release-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      id-token: write

    steps:
      - name: Checkout exact retained candidate source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.candidate_sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Node.js 22.14
        uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org

      - name: Install OIDC-capable npm 11.17
        run: npm install --global --ignore-scripts npm@11.17.0

      - name: Fetch guarded main and release tag
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.git_tag }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Verify protected tag, identity, commit, and ancestry
        id: guard
        env:
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.git_tag }}
        run: >-
          python3 scripts/release_guard.py
          --policy .github/release-policy.json
          --release-manifest release/release.json
          --python-metadata pyproject.toml
          --npm-metadata web/package.json
          --event-name publish
          --repository "${GITHUB_REPOSITORY}"
          --ref "refs/tags/${RELEASE_TAG}"
          --commit "${CANDIDATE_SHA}"
          --release-tag "${RELEASE_TAG}"
          --release-target main
          --main-ref origin/main
          --github-output "${GITHUB_OUTPUT}"

      - name: Download exact retained candidate bundle
        uses: actions/download-artifact@v8
        with:
          name: gigaloom-release-candidate-${{ needs.resolve.outputs.candidate_sha }}
          path: dist/release-candidate
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify retained checksums and optional recovery digest
        id: manifest
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.resolve.outputs.candidate_manifest_sha256 }}
        run: |
          (cd dist/release-candidate && sha256sum --check SHA256SUMS)
          python3 -c 'import hashlib, os, pathlib, re, sys; expected = os.environ["EXPECTED_MANIFEST_SHA256"]; actual = hashlib.sha256(pathlib.Path("dist/release-candidate/candidate-manifest.json").read_bytes()).hexdigest(); valid = not expected or (re.fullmatch(r"[0-9a-f]{64}", expected) and actual == expected); print(f"sha256={actual}", file=open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8")); sys.exit(0 if valid else "candidate manifest digest mismatch")'

      - name: Reverify retained candidate without rebuilding
        env:
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
        run: |
          python3 scripts/verify_release_artifacts.py \
            --release release/release.json \
            --artifact-dir dist/release-candidate \
            --source-revision "${CANDIDATE_SHA}"
          python3 scripts/check_legacy_identifiers.py \
            --wheel dist/release-candidate/*.whl \
            --sdist dist/release-candidate/*.tar.gz \
            --npm-tarball dist/release-candidate/*.tgz

      - name: Prove requested recovery mode against public registries
        env:
          RECOVERY_MODE: ${{ needs.resolve.outputs.recovery_mode }}
        run: >-
          python3 scripts/release_registry_guard.py
          --release release/release.json
          --artifact-dir dist/release-candidate
          --mode "${RECOVERY_MODE}"

      - name: Publish only a missing npm version with OIDC provenance
        if: needs.resolve.outputs.recovery_mode == 'initial' || needs.resolve.outputs.recovery_mode == 'recover-npm'
        run: npm publish dist/release-candidate/*.tgz --provenance --access public --tag "${{ steps.guard.outputs.npm_dist_tag }}"

      - name: Verify registry state after npm publication
        if: needs.resolve.outputs.recovery_mode == 'initial' || needs.resolve.outputs.recovery_mode == 'recover-npm'
        env:
          RECOVERY_MODE: ${{ needs.resolve.outputs.recovery_mode }}
        run: |
          if [[ "${RECOVERY_MODE}" == "initial" ]]; then
            expected_mode=recover-pypi
          else
            expected_mode=release-assets-only
          fi
          python3 scripts/release_registry_guard.py \
            --release release/release.json \
            --artifact-dir dist/release-candidate \
            --mode "${expected_mode}" \
            --attempts 12 \
            --retry-seconds 10

      - name: Publish only a missing PyPI version with trusted publishing
        if: needs.resolve.outputs.recovery_mode == 'initial' || needs.resolve.outputs.recovery_mode == 'recover-pypi'
        run: uv publish dist/release-candidate/*.whl dist/release-candidate/*.tar.gz

      - name: Prove both registries contain the retained candidate bytes
        run: >-
          python3 scripts/release_registry_guard.py
          --release release/release.json
          --artifact-dir dist/release-candidate
          --mode release-assets-only
          --attempts 12
          --retry-seconds 10

      - name: Create GitHub Release last from the retained bundle
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.guard.outputs.is_prerelease }}
          RELEASE_TAG: ${{ steps.guard.outputs.tag }}
        run: |
          release_flags=(--latest)
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "${RELEASE_TAG}" \
            dist/release-candidate/* \
            --verify-tag \
            --title "GigaLoom ${{ steps.guard.outputs.release }}" \
            --generate-notes \
            "${release_flags[@]}"
